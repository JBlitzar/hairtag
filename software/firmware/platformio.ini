; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Shared NimBLE + partition settings inherited by both envs via variable references
[pio_common]
lib_deps             = h2zero/NimBLE-Arduino@^1.4.3
board_build.partitions = partitions.csv
monitor_speed        = 9600
build_unflags =
    -DCONFIG_BT_ENABLED
    -DCONFIG_BTDM_CTRL_MODE_BLE_ONLY
    -DCONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY
    -DCONFIG_BTDM_CTRL_MODE_BTDM
build_flags_nimble =
    -DARDUINO_ARCH_ESP32
    -DESP_PLATFORM
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=8
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=4096
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER
    -DCONFIG_BT_NIMBLE_NVS_PERSIST
    -DCONFIG_BT_NIMBLE_SM_LEGACY
    -DCONFIG_BT_NIMBLE_SM_SC
    -DCONFIG_BT_NIMBLE_USE_ESP_TIMER
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DCONFIG_ARDUHAL_ESP_LOG=1

; ── Hairtag custom board (bare ESP32-C3FH4, no native USB) ───────────────────
; This board exposes only UART0 (U0TXD/U0RXD) on the J1 flashing header, so
; Serial must map to UART0 rather than USB-CDC. Flash and monitor over the
; CP2102 dongle or the Icepi Zero FPGA bridge (both drive U0TXD/U0RXD/EN/DTR).
[env:hairtag-c3]
platform                 = espressif32
board                    = esp32-c3-devkitm-1
framework                = arduino
lib_deps                 = ${pio_common.lib_deps}
board_build.partitions   = ${pio_common.board_build.partitions}
monitor_speed            = ${pio_common.monitor_speed}
build_unflags            = ${pio_common.build_unflags}
build_flags =
    ${pio_common.build_flags_nimble}
    ; Serial → UART0 (U0TXD/U0RXD); no native USB pins on this board
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
; Monitor must not touch DTR/RTS: the FPGA bridge routes them to EN/GPIO9, so
; asserting them resets the chip. Flashing is unaffected (esptool drives its
; own reset handshake independently of these monitor settings).
monitor_rts              = 0
monitor_dtr              = 0

; ── Bare ESP32 (WROOM-32 / DevKit v1) ────────────────────────────────────────
[env:esp32dev]
platform                 = espressif32
board                    = esp32dev
framework                = arduino
lib_deps                 = ${pio_common.lib_deps}
board_build.partitions   = ${pio_common.board_build.partitions}
monitor_speed            = ${pio_common.monitor_speed}
build_unflags            = ${pio_common.build_unflags}
build_flags =
    ${pio_common.build_flags_nimble}
    ; No native USB on bare ESP32 — Serial uses UART0 automatically
