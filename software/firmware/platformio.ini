; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Pure ESP-IDF build (IDF 5.5). The bootloader is compiled from source so
; sdkconfig.defaults can enable CONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP,
; the largest fixed per-wake energy saving for this deep-sleep beacon.

[env:esp32-c3-devkitm-1]
platform               = espressif32
board                  = esp32-c3-devkitm-1
framework              = espidf
board_build.partitions = partitions.csv
monitor_speed          = 115200

; Debug variant: enables verbose logging at runtime (production is silent).
[env:esp32-c3-debug]
extends     = env:esp32-c3-devkitm-1
build_flags = -DHAIRTAG_DEBUG
